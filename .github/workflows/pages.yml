name: deploy-landing
on:
  push:
    branches: [claude/modest-goodall-i5cvdp, main]
    paths: [landing/**, scripts/build_landing.sh, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/build_landing.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Проверка, что сайт открывается
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -sSf -m 20 "${{ steps.deploy.outputs.page_url }}" | grep -q "<title>Орёл ⇄ Москва</title>"; then
              echo "Сайт доступен: ${{ steps.deploy.outputs.page_url }}"; exit 0
            fi
            sleep 10
          done
          echo "Сайт не отвечает или отдаёт не ту страницу"; exit 1
