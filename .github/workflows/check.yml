name: check-tickets
on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub запускает не чаще раза в 5 мин, часто с задержкой
  workflow_dispatch:
concurrency: check-tickets
jobs:
  check:
    # включается переменной репозитория ENABLE_CHECK=true (Settings → Variables)
    if: ${{ vars.ENABLE_CHECK == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - run: python bot.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATES: ${{ vars.DATES }}
          TRAINS: ${{ vars.TRAINS }}
          CAR_TYPES: ${{ vars.CAR_TYPES }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          FROM_CODE: ${{ vars.FROM_CODE }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: state.json
          key: state-${{ github.run_id }}
